    const TIMELINE_START = 8 * 60;
    const TIMELINE_END = 17 * 60;
    const TIMELINE_RANGE = TIMELINE_END - TIMELINE_START;

    const formatDateDisplay = (ymd) => {
      const d = new Date(`${ymd}T00:00:00`);
      return d.toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short", year: "numeric" });
    };
    const timeToMinutes = (hhmm) => {
      const m = String(hhmm || "").match(/^(\d{2}):(\d{2})$/);
      if (!m) return null;
      return Number(m[1]) * 60 + Number(m[2]);
    };
    const overlaps = (aStart, aEnd, bStart, bEnd) => {
      const a1 = timeToMinutes(aStart), a2 = timeToMinutes(aEnd);
      const b1 = timeToMinutes(bStart), b2 = timeToMinutes(bEnd);
      if ([a1, a2, b1, b2].some(v => v == null)) return false;
      return a1 < b2 && b1 < a2;
    };
    const shiftDate = (ymd, delta) => {
      const d = new Date(`${ymd}T00:00:00`);
      d.setDate(d.getDate() + delta);
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    };
    const shiftMonthKey = (ym, delta) => {
      const [y, m] = ym.split("-").map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    };
    const monthRange = (ym) => {
      const [y, m] = ym.split("-").map(Number);
      const first = new Date(y, m - 1, 1);
      const last = new Date(y, m, 0);
      return {
        start: `${first.getFullYear()}-${pad2(first.getMonth() + 1)}-${pad2(first.getDate())}`,
        end: `${last.getFullYear()}-${pad2(last.getMonth() + 1)}-${pad2(last.getDate())}`,
      };
    };
    const buildCalendarGrid = (ym) => {
      const [y, m] = ym.split("-").map(Number);
      const first = new Date(y, m - 1, 1);
      const start = new Date(first);
      start.setDate(start.getDate() - start.getDay());
      return Array.from({ length: 42 }).map((_, i) => {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        return {
          key: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`,
          inMonth: d.getMonth() === m - 1,
        };
      });
    };
    const formatDuration = (minutes) => {
      if (!Number.isFinite(minutes) || minutes <= 0) return "0h";
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      if (h && m) return `${h}h ${m}m`;
      if (h) return `${h}h`;
      return `${m}m`;
    };
    const makePlaceholderSvg = (roomName) => {
      const label = encodeURIComponent(roomName);
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#0f172a"/>
              <stop offset="55%" stop-color="#334155"/>
              <stop offset="100%" stop-color="#64748b"/>
            </linearGradient>
          </defs>
          <rect width="1200" height="700" fill="url(#g)"/>
          <circle cx="170" cy="150" r="95" fill="rgba(255,255,255,0.08)"/>
          <circle cx="1010" cy="590" r="120" fill="rgba(255,255,255,0.06)"/>
          <rect x="80" y="465" width="1040" height="145" rx="24" fill="rgba(255,255,255,0.10)"/>
          <text x="90" y="165" fill="white" font-size="44" font-family="Arial, sans-serif" font-weight="700">ISE Room Preview</text>
          <text x="90" y="240" fill="rgba(255,255,255,0.88)" font-size="32" font-family="Arial, sans-serif">${label}</text>
          <text x="90" y="535" fill="rgba(255,255,255,0.78)" font-size="26" font-family="Arial, sans-serif">Add a real room photo later if needed.</text>
        </svg>
      `;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    };

    function apiPost(payload) {
      const sessionToken = localStorage.getItem("room_dash_session_token") || "";
      const finalPayload = sessionToken && !payload.session_token
        ? { ...payload, session_token: sessionToken }
        : payload;

      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((err) => reject(new Error(err && err.message ? err.message : "Server error")))
          .apiRouter(finalPayload);
      });
    }

    function Panel({ title, subtitle, right, children, className = "" }) {
      return (
        <section className={`glass border border-white/60 rounded-[28px] shadow-[0_20px_60px_-25px_rgba(15,23,42,0.20)] p-5 md:p-6 ${className}`}>
          <div className="mb-5 flex items-start justify-between gap-4">
            <div>
              <h2 className="text-xl font-black tracking-tight text-slate-900">{title}</h2>
              {subtitle && <p className="text-sm text-slate-500 mt-1">{subtitle}</p>}
            </div>
            {right}
          </div>
          {children}
        </section>
      );
    }

    function MetricCard({ title, value, note, accent = "from-slate-900 to-slate-700" }) {
      return (
        <div className="relative overflow-hidden rounded-[24px] border border-white/70 bg-white shadow-[0_16px_50px_-24px_rgba(15,23,42,0.20)] p-5">
          <div className={`absolute inset-x-0 top-0 h-1.5 bg-gradient-to-r ${accent}`}></div>
          <div className="text-sm font-medium text-slate-500">{title}</div>
          <div className="mt-2 text-2xl md:text-3xl font-black tracking-tight text-slate-900 break-words leading-tight">{value}</div>
          <div className="mt-2 text-sm text-slate-500">{note}</div>
        </div>
      );
    }

    function Field({ label, children, hint }) {
      return (
        <label className="block">
          <div className="text-sm font-bold text-slate-700 mb-2">{label}</div>
          {children}
          {hint && <div className="text-xs text-slate-500 mt-2">{hint}</div>}
        </label>
      );
    }

    function RoomBookingDashboard() {
      const [selectedDate, setSelectedDate] = useState(todayKey());
      const [calendarMonth, setCalendarMonth] = useState(todayKey().slice(0, 7));
      const [bookings, setBookings] = useState([]);
      const [calendarBookings, setCalendarBookings] = useState([]);
      const [rangeBookings, setRangeBookings] = useState([]);
      const [rooms, setRooms] = useState(ROOMS);
      const [loading, setLoading] = useState(false);
      const [bootLoading, setBootLoading] = useState(true);
      const [busyText, setBusyText] = useState("Loading dashboard...");
      const [toast, setToast] = useState(null);
      const [selectedRoom, setSelectedRoom] = useState("ALL");
      const [viewMode, setViewMode] = useState("day");
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState("login");
      const [authForm, setAuthForm] = useState({
        email: "", password: "", code: "", new_password: "", confirm_password: ""
      });
      const [form, setForm] = useState({
        room_name: ROOMS[0],
        book_date: todayKey(),
        start_time: "09:00",
        end_time: "10:00",
        purpose: "",
        note: "",
        recurrence_freq: "NONE",
        recurrence_interval: 1,
        recurrence_end_type: "COUNT",
        recurrence_count: 4,
        recurrence_until: "",
      });

      const getStoredSessionToken = () => localStorage.getItem("room_dash_session_token") || "";
      const setStoredSessionToken = (token) => localStorage.setItem("room_dash_session_token", token);
      const clearStoredSessionToken = () => localStorage.removeItem("room_dash_session_token");

      useEffect(() => {
        setForm(prev => ({ ...prev, book_date: selectedDate }));
        setCalendarMonth(selectedDate.slice(0, 7));
      }, [selectedDate]);

      const notify = (msg, type = "ok") => {
        setToast({ msg, type });
        window.clearTimeout(window.__roomToast);
        window.__roomToast = window.setTimeout(() => setToast(null), 2800);
      };

      const runBusy = async (message, fn) => {
        setBusyText(message);
        setLoading(true);
        try { return await fn(); }
        finally { setLoading(false); }
      };

      const bootstrapSession = async () => {
        const sessionToken = getStoredSessionToken();
        if (!sessionToken) {
          setBootLoading(false);
          return;
        }
        setBusyText("Checking session...");
        setLoading(true);
        try {
          const result = await apiPost({ action: "roomGetSession", session_token: sessionToken });
          if (result.ok) {
            setCurrentUser(result.user || null);
            if (result.rooms?.length) setRooms(result.rooms);
            setAuthForm(prev => ({ ...prev, email: result.user?.email || prev.email }));
          } else {
            clearStoredSessionToken();
            setCurrentUser(null);
          }
        } catch (err) {
          clearStoredSessionToken();
          setCurrentUser(null);
        } finally {
          setLoading(false);
          setBootLoading(false);
        }
      };

      useEffect(() => { bootstrapSession(); }, []);

      const loadBookings = async (date, retry = true) => {
        const result = await apiPost({ action: "fetchRoomBookings", book_date: date });
        if (!result.ok) {
          if (result.error_code === "AUTH_REQUIRED" && retry) {
            await sleep(600);
            return loadBookings(date, false);
          }
          if (result.error_code === "AUTH_REQUIRED") {
            clearStoredSessionToken();
            setCurrentUser(null);
            return false;
          }
          notify(result.error || "Unable to load bookings", "err");
          return false;
        }
        setRooms(result.rooms || ROOMS);
        setBookings(result.bookings || []);
        return true;
      };

      const loadRangeBookings = async (startDate, endDate, setter, errorMessage = "Unable to load range data", retry = true) => {
        const result = await apiPost({ action: "fetchRoomBookingsRange", start_date: startDate, end_date: endDate });
        if (!result.ok) {
          if (result.error_code === "AUTH_REQUIRED" && retry) {
            await sleep(600);
            return loadRangeBookings(startDate, endDate, setter, errorMessage, false);
          }
          if (result.error_code === "AUTH_REQUIRED") {
            clearStoredSessionToken();
            setCurrentUser(null);
            return false;
          }
          notify(result.error || errorMessage, "err");
          return false;
        }
        setRooms(result.rooms || ROOMS);
        setter(result.bookings || []);
        return true;
      };

      useEffect(() => {
        if (!currentUser) return;
        runBusy("Loading room schedule...", async () => {
          await Promise.all([
            loadBookings(selectedDate),
            loadRangeBookings(selectedDate, shiftDate(selectedDate, 6), setRangeBookings, "Unable to load weekly overview"),
          ]);
        });
      }, [selectedDate, currentUser?.email]);

      useEffect(() => {
        if (!currentUser) return;
        const { start, end } = monthRange(calendarMonth);
        runBusy("Loading calendar...", async () => {
          await loadRangeBookings(start, end, setCalendarBookings, "Unable to load calendar");
        });
      }, [calendarMonth, currentUser?.email]);

      const filteredBookings = useMemo(() => {
        const base = bookings.filter(b => b.status === "ACTIVE" || !b.status);
        if (selectedRoom === "ALL") return base;
        return base.filter(b => b.room_name === selectedRoom);
      }, [bookings, selectedRoom]);

      const filteredCalendarBookings = useMemo(() => {
        const base = calendarBookings.filter(b => b.status === "ACTIVE" || !b.status);
        if (selectedRoom === "ALL") return base;
        return base.filter(b => b.room_name === selectedRoom);
      }, [calendarBookings, selectedRoom]);

      const selectedRoomImage = useMemo(() => {
        const value = ROOM_IMAGES[form.room_name];
        if (value) return value;
        return makePlaceholderSvg(form.room_name, ROOM_STYLES[form.room_name]?.accent);
      }, [form.room_name]);

      const summary = useMemo(() => {
        const totalBookings = filteredBookings.length;
        const totalMinutes = filteredBookings.reduce((sum, b) => {
          const a = timeToMinutes(b.start_time), z = timeToMinutes(b.end_time);
          return sum + (a != null && z != null ? Math.max(0, z - a) : 0);
        }, 0);

        const byRoom = rooms.map(room => {
          const items = filteredBookings.filter(b => b.room_name === room);
          const mins = items.reduce((sum, b) => {
            const a = timeToMinutes(b.start_time), z = timeToMinutes(b.end_time);
            return sum + (a != null && z != null ? Math.max(0, z - a) : 0);
          }, 0);
          return { room, count: items.length, minutes: mins };
        });

        const busiest = [...byRoom].sort((a,b) => b.minutes - a.minutes)[0];
        const now = new Date();
        const cur = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
        const cur2 = `${pad2(now.getHours())}:${pad2((now.getMinutes()+1) % 60)}`;

        const currentStatus = rooms.map(room => ({
          room,
          inUse: bookings.some(b => b.room_name === room && b.book_date === selectedDate && overlaps(b.start_time, b.end_time, cur, cur2))
        }));

        return {
          totalBookings,
          totalMinutes,
          busiest,
          freeNow: currentStatus.filter(x => !x.inUse).length,
          currentStatus,
          byRoom,
        };
      }, [filteredBookings, rooms, bookings, selectedDate]);

      const timelineByRoom = useMemo(() => {
        return rooms.map(room => {
          const items = filteredBookings
            .filter(b => b.room_name === room)
            .map(b => ({ ...b, startMin: timeToMinutes(b.start_time), endMin: timeToMinutes(b.end_time) }))
            .filter(b => b.startMin != null && b.endMin != null && b.endMin > b.startMin)
            .sort((a,b) => a.startMin - b.startMin);

          const lanes = [];
          const blocks = items.map(item => {
            let lane = 0;
            while (lanes[lane] != null && lanes[lane] > item.startMin) lane += 1;
            lanes[lane] = item.endMin;
            return { ...item, lane };
          });

          return { room, blocks, laneCount: Math.max(1, ...blocks.map(b => b.lane + 1), 1) };
        });
      }, [filteredBookings, rooms]);

      const canSubmit = useMemo(() => {
        const validRecurrence =
          form.recurrence_freq === "NONE" ||
          (form.recurrence_end_type === "COUNT"
            ? Number(form.recurrence_count || 0) >= 1
            : !!form.recurrence_until);

        return (
          !!currentUser?.email &&
          form.room_name &&
          form.book_date &&
          form.start_time &&
          form.end_time &&
          form.purpose.trim() &&
          validRecurrence &&
          timeToMinutes(form.start_time) != null &&
          timeToMinutes(form.end_time) != null &&
          timeToMinutes(form.start_time) < timeToMinutes(form.end_time)
        );
      }, [form, currentUser?.email]);

      const submitBooking = async () => {
        if (!canSubmit) {
          notify("Please complete room, date, time, and purpose.", "err");
          return;
        }
        const recurrence = form.recurrence_freq === "NONE"
          ? null
          : {
              freq: form.recurrence_freq,
              interval: Number(form.recurrence_interval || 1),
              end_type: form.recurrence_end_type,
              count: Number(form.recurrence_count || 1),
              until: form.recurrence_until || "",
            };

        await runBusy("Saving booking...", async () => {
          const result = await apiPost({
            action: "bookRoomDashboard",
            room_name: form.room_name,
            book_date: form.book_date,
            start_time: form.start_time,
            end_time: form.end_time,
            purpose: form.purpose,
            note: form.note,
            recurrence,
          });

          if (!result.ok) {
            if (result.error_code === "AUTH_REQUIRED") {
              clearStoredSessionToken();
              setCurrentUser(null);
              return;
            }
            if (result.conflicts?.length) {
              const first = result.conflicts[0];
              notify(`Conflict on ${first.date} (${first.start_time}-${first.end_time})`, "err");
            } else {
              notify(result.error || "Unable to save booking", "err");
            }
            return;
          }

          notify(result.created_count > 1 ? `Recurring booking saved (${result.created_count} times)` : "Booking saved");
          setForm(prev => ({ ...prev, purpose: "", note: "" }));

          const month = form.book_date.slice(0, 7);
          const range = monthRange(month);
          await Promise.all([
            loadBookings(form.book_date),
            loadRangeBookings(form.book_date, shiftDate(form.book_date, 6), setRangeBookings, "Unable to load weekly overview"),
            loadRangeBookings(range.start, range.end, setCalendarBookings, "Unable to load calendar"),
          ]);
        });
      };

      const cancelBooking = async (bookingId, cancelScope = "ONE") => {
        if (!currentUser?.email) {
          notify("Please log in first.", "err");
          return;
        }
        if (!window.confirm(cancelScope === "SERIES" ? "Cancel the whole recurring series?" : "Cancel this booking?")) return;

        await runBusy("Cancelling booking...", async () => {
          const result = await apiPost({
            action: "cancelRoomBookingDashboard",
            booking_id: bookingId,
            cancel_scope: cancelScope,
          });

          if (!result.ok) {
            if (result.error_code === "AUTH_REQUIRED") {
              clearStoredSessionToken();
              setCurrentUser(null);
              return;
            }
            notify(result.error || "Unable to cancel booking", "err");
            return;
          }

          notify(cancelScope === "SERIES" ? "Series cancelled" : "Booking cancelled");
          const range = monthRange(calendarMonth);
          await Promise.all([
            loadBookings(selectedDate),
            loadRangeBookings(selectedDate, shiftDate(selectedDate, 6), setRangeBookings, "Unable to load weekly overview"),
            loadRangeBookings(range.start, range.end, setCalendarBookings, "Unable to load calendar"),
          ]);
        });
      };

      const handleLogin = async () => {
        const email = normalizeEmail(authForm.email);
        const password = String(authForm.password || "");
        if (!email || !password) {
          notify("Please enter email and password.", "err");
          return;
        }

        await runBusy("Signing in...", async () => {
          const result = await apiPost({ action: "roomLogin", email, password });
          if (!result.ok) {
            notify(result.error || "Login failed", "err");
            return;
          }

          setStoredSessionToken(result.session_token);
          setRooms(result.rooms || ROOMS);
          setAuthForm(prev => ({ ...prev, email, password: "" }));
          setAuthMode("login");
          notify(`Welcome back, ${result.user?.name || email}`);

          await sleep(350);
          setCurrentUser(result.user || { email, name: email });
        });
      };

      const handleLogout = async () => {
        await runBusy("Signing out...", async () => {
          try { await apiPost({ action: "roomLogout" }); } catch (err) {}
          clearStoredSessionToken();
          setCurrentUser(null);
          setBookings([]);
          setCalendarBookings([]);
          setRangeBookings([]);
          setAuthMode("login");
          notify("Signed out");
        });
      };

      const handleRequestReset = async () => {
        const email = normalizeEmail(authForm.email);
        if (!email) {
          notify("Please enter your email.", "err");
          return;
        }

        await runBusy("Sending reset code...", async () => {
          const result = await apiPost({ action: "roomRequestPasswordReset", email });
          if (!result.ok) {
            notify(result.error || "Unable to send reset code", "err");
            return;
          }
          setAuthMode("forgot_confirm");
          notify(result.message || "If the email is eligible, a reset code has been sent.");
        });
      };

      const handleConfirmReset = async () => {
        const email = normalizeEmail(authForm.email);
        const code = String(authForm.code || "").trim();
        const newPassword = String(authForm.new_password || "");
        const confirmPassword = String(authForm.confirm_password || "");

        if (!email || !code || !newPassword) {
          notify("Please complete email, code, and new password.", "err");
          return;
        }
        if (newPassword !== confirmPassword) {
          notify("Password confirmation does not match.", "err");
          return;
        }

        await runBusy("Updating password...", async () => {
          const result = await apiPost({
            action: "roomConfirmPasswordReset",
            email, code, new_password: newPassword,
          });
          if (!result.ok) {
            notify(result.error || "Unable to reset password", "err");
            return;
          }
          setAuthMode("login");
          setAuthForm(prev => ({ ...prev, password: "", code: "", new_password: "", confirm_password: "" }));
          notify(result.message || "Password updated successfully");
        });
      };

      const nextSevenDays = useMemo(() => {
        const counts = rangeBookings.reduce((acc, b) => {
          acc[b.book_date] = (acc[b.book_date] || 0) + 1;
          return acc;
        }, {});
        return Array.from({ length: 7 }).map((_, i) => {
          const key = shiftDate(selectedDate, i);
          const d = new Date(`${key}T00:00:00`);
          return { key, label: d.toLocaleDateString("en-GB", { weekday:"short", day:"2-digit", month:"short" }), count: counts[key] || 0 };
        });
      }, [selectedDate, rangeBookings]);

      const calendarCells = useMemo(() => {
        return buildCalendarGrid(calendarMonth).map(day => {
          const items = filteredCalendarBookings.filter(b => b.book_date === day.key);
          const freeRooms = rooms.filter(room => !items.some(x => x.room_name === room)).length;
          return { ...day, items, freeRooms };
        });
      }, [calendarMonth, filteredCalendarBookings, rooms]);

      const nowLineLeftPercent = useMemo(() => {
        const now = new Date();
        const minutes = now.getHours() * 60 + now.getMinutes();
        const clamped = Math.max(TIMELINE_START, Math.min(TIMELINE_END, minutes));
        return ((clamped - TIMELINE_START) / TIMELINE_RANGE) * 100;
      }, [selectedDate]);

      const selectedRoomNow = summary.currentStatus.find(x => x.room === form.room_name);

      const AuthShell = (
        <div className="max-w-7xl mx-auto p-5 md:p-8 space-y-6">
          <div className="relative overflow-hidden rounded-[30px] border border-white/70 bg-gradient-to-r from-slate-950 via-slate-900 to-slate-800 text-white shadow-[0_25px_70px_-25px_rgba(15,23,42,0.6)] px-6 py-8 md:px-8 md:py-10">
            <div className="absolute -right-16 -top-16 h-48 w-48 rounded-full bg-white/10 blur-2xl"></div>
            <div className="absolute -left-12 -bottom-14 h-40 w-40 rounded-full bg-indigo-400/20 blur-2xl"></div>
            <div className="relative grid lg:grid-cols-[1.15fr_0.85fr] gap-8 items-start">
              <div>
                <div className="inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/10 px-3 py-1 text-xs font-semibold tracking-wide uppercase text-slate-200">
                  Secure Access
                </div>
                <h1 className="mt-4 text-3xl md:text-4xl font-black tracking-tight">ISE Room Booking Dashboard</h1>
                <p className="mt-3 max-w-2xl text-slate-300">
                  Sign in with your approved email and password to view schedules, book rooms, and manage your reservations.
                </p>
              </div>

              <section className="glass border border-white/60 rounded-[28px] shadow-[0_20px_60px_-25px_rgba(15,23,42,0.20)] p-5 md:p-6 bg-white text-slate-800">
                {authMode === "login" && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-xl font-black tracking-tight text-slate-900">Sign in</h2>
                      <p className="text-sm text-slate-500 mt-1">Use the same allowed user sheet and account from your existing system.</p>
                    </div>
                    <Field label="Email">
                      <input type="email" value={authForm.email} onChange={e => setAuthForm(prev => ({ ...prev, email: e.target.value }))} className="w-full px-4 py-3 rounded-2xl border border-slate-300 bg-white shadow-sm" placeholder="name@chula.ac.th" />
                    </Field>
                    <Field label="Password">
                      <input type="password" value={authForm.password} onChange={e => setAuthForm(prev => ({ ...prev, password: e.target.value }))} className="w-full px-4 py-3 rounded-2xl border border-slate-300 bg-white shadow-sm" placeholder="Your password" />
                    </Field>

                          </Field>

                    <Field label="Purpose">

                    </Field>

                    <Field label="Note (optional)">
                      <textarea rows="3" value={form.note} onChange={e => setForm(prev => ({ ...prev, note: e.target.value }))} className="w-full px-4 py-3 rounded-2xl border border-slate-300 bg-white shadow-sm" placeholder="Additional note" />
                    </Field>

                    <button onClick={submitBooking} disabled={!canSubmit} className="w-full px-4 py-3 rounded-2xl bg-slate-900 text-white font-bold hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed">

                <Panel title="Utilization by Room" subtitle="Daily occupancy based on 08:00–17:00">
                  <div className="space-y-4">
                    {summary.byRoom.map(item => (
                      <div key={item.room}>
                        <div className="flex items-center justify-between text-sm mb-1.5">
                          <span className="font-bold text-slate-700">{item.room}</span>
                          <span className="text-slate-500">{formatDuration(item.minutes)}</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-3.5 overflow-hidden">
                          <div className={`${ROOM_STYLES[item.room]?.bar?.split(" ")[0] || "bg-slate-700"} h-3.5 rounded-full`} style={{ width: `${Math.min(100, (item.minutes / (12 * 60)) * 100)}%` }} />
                        </div>

              </div>
            </div>
          </div>

      );
    }
   

    const root = ReactDOM.createRoot(document.getElementById("root"));

    function addMinutesToHHMM(hhmm, minutesToAdd) {
      const parts = String(hhmm || "").split(":");
      const h = Number(parts[0] || 0);
      const m = Number(parts[1] || 0);
      const total = h * 60 + m + Number(minutesToAdd || 0);
      const hh = String(Math.floor((total % 1440) / 60)).padStart(2, "0");
      const mm = String(total % 60).padStart(2, "0");
      return `${hh}:${mm}`;
    }

    function formatDisplayMinutes(minutes) {
      const m = Number(minutes || 0);
      const h = Math.floor(m / 60);
      const r = m % 60;
      if (h && r) return `${h}h ${r}m`;
      if (h) return `${h}h`;
      return `${r}m`;
    }

    function shortRoomName(roomName) {
      return String(roomName || "")
        .replace("ISE Meeting Room ", "Room ")
        .replace(" (1st Fl.)", "")
        .replace(" (2nd Fl.)", "")
        .replace(" (Interhub)", "");
    }

      const btnBase = "rounded-2xl px-5 py-3 text-sm font-semibold transition active:scale-[0.98]";
      const activeBtn = "bg-white text-slate-950";
      const idleBtn = "bg-white/15 text-white hover:bg-white/25";

      return (
        <div className="flex flex-wrap gap-3 justify-end">
          <button onClick={() => setView("room")} className={`${btnBase} ${view === "room" ? activeBtn : idleBtn}`}>
            Room
          </button>
          <button onClick={() => setView("overview")} className={`${btnBase} ${view === "overview" ? activeBtn : idleBtn}`}>
            All Rooms
          </button>
          <button
            onClick={async () => {
              setView("day");
              await loadSchedule("DAY");
            }}
            className={`${btnBase} ${view === "day" ? activeBtn : idleBtn}`}
          >
            Day
          </button>
          <button
            onClick={async () => {
              setView("month");
              await loadSchedule("MONTH");
            }}
            className={`${btnBase} ${view === "month" ? activeBtn : idleBtn}`}
          >
            Month
          </button>
          <button onClick={loadState} className={`${btnBase} ${idleBtn}`}>
            Refresh

          <button onClick={resetDisplay} className="rounded-2xl bg-white/10 px-4 py-3 text-sm text-white/70 hover:bg-white/20">
            Reset
          </button>
        </div>
      );
    }

    function RoomDisplayApp() {
      const params = new URLSearchParams(window.location.search);
      const tokenFromUrl = params.get("token") || "";
      const savedToken = localStorage.getItem("room_display_device_token") || "";

      const [deviceToken, setDeviceToken] = React.useState(tokenFromUrl || savedToken);
      const [tokenInput, setTokenInput] = React.useState(tokenFromUrl || savedToken);
      const [state, setState] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const [message, setMessage] = React.useState("");
      const [requesterEmail, setRequesterEmail] = React.useState("");
      const [purpose, setPurpose] = React.useState("Walk-in meeting");
      const [displayView, setDisplayView] = React.useState("overview"); // room | overview | day | month
      const [selectedDisplayRoom, setSelectedDisplayRoom] = React.useState("");
      const [schedule, setSchedule] = React.useState(null);
      const [scheduleDate, setScheduleDate] = React.useState("");

      const saveToken = () => {
        const t = String(tokenInput || "").trim();
        if (!t) {
          setMessage("Please enter display token");
          return;
        }
        localStorage.setItem("room_display_device_token", t);
        setDeviceToken(t);
        setMessage("Display token saved");
      };

      const resetDisplay = () => {
        localStorage.removeItem("room_display_device_token");
        setDeviceToken("");
        setTokenInput("");
        setState(null);
        setSchedule(null);
        setSelectedDisplayRoom("");
        setMessage("");
      };

      const loadState = async () => {
        if (!deviceToken) return;
        try {
          const res = await apiPost({
            action: "fetchRoomDisplayState",
            device_token: deviceToken,
          });

          if (!res.ok) {
            setMessage(res.error || "Unable to load room display state");
            return;
          }

          setState(res);
          if (!selectedDisplayRoom && res.room_name) setSelectedDisplayRoom(res.room_name);
          setScheduleDate(prev => prev || res.now_date || "");
          setMessage("");
        } catch (err) {
          setMessage(String(err));
        }
      };

      const loadSchedule = async (scope, customDate) => {
        if (!deviceToken) return;

        const targetDate = customDate || scheduleDate || state?.now_date || "";
        const roomName = selectedDisplayRoom || "";

        try {
          setLoading(true);
          setMessage("");

          const res = await apiPost({
            action: "fetchRoomDisplaySchedule",
            device_token: deviceToken,
            scope,
            date: targetDate,
            room_name: roomName,
          });

          if (!res.ok) {
            setMessage(res.error || "Unable to load schedule");
            return;
          }

          setSchedule(res);
          setScheduleDate(res.date || targetDate);
        } catch (err) {
          setMessage(String(err));
        } finally {
          setLoading(false);
        }
      };

      React.useEffect(() => {
        if (!deviceToken) return;

        loadState();
        const timer = setInterval(loadState, 15000);
        return () => clearInterval(timer);
      }, [deviceToken]);

      const activeRoomName = selectedDisplayRoom || state?.room_name || "";

      const activeRoomState = React.useMemo(() => {
        if (!state) return null;

        const overview = state.room_overview || [];
        const found = overview.find(r => r.room_name === activeRoomName);
        if (found) return found;

        return {
          room_name: state.room_name,
          in_use: state.in_use,
          current_booking: state.current_booking,
          next_booking: state.next_booking,
          bookings: state.bookings || [],
          booking_count: (state.bookings || []).length,
          reserved_minutes: 0,
        };
      }, [state, activeRoomName]);

      const quickBook = async (minutes) => {
        if (!state || !activeRoomName) return;

        const email = String(requesterEmail || "").trim();
        if (!email) {
          setMessage("Please enter your email before booking");
          return;
        }

        const startTime = state.now_time;
        const endTime = addMinutesToHHMM(startTime, minutes);

        setLoading(true);
        setMessage("");

        try {
          const res = await apiPost({
            action: "bookRoomFromDisplay",
            device_token: deviceToken,
            room_name: activeRoomName,
            book_date: state.now_date,
            start_time: startTime,
            end_time: endTime,
            purpose: purpose || "Walk-in meeting",
            requester_email: email,
            note: "Booked from center room display",
          });

          if (!res.ok) {
            setMessage(res.error || "Unable to book room");
          } else {
            setMessage(`Booked ${shortRoomName(activeRoomName)} ${res.start_time} - ${res.end_time}`);
            await loadState();

          setMessage(String(err));

                      ) : (
                        <div className="mt-2 text-xl font-bold text-white/70">No upcoming booking</div>
                      )}
                    </div>

                    <div className="mt-5 flex items-center justify-between rounded-3xl bg-white/10 p-5">
                      <div>

                        <div className="text-2xl font-black">{room.booking_count || 0}</div>
                      </div>
                      <div className="text-right">
                        <div className="text-sm text-white/50">Reserved</div>
                        <div className="text-2xl font-black">{formatDisplayMinutes(room.reserved_minutes)}</div>
                      </div>
                    </div>

                    <div className="mt-5 rounded-2xl bg-white/10 px-4 py-3 text-center text-sm font-bold text-white/80">
                      Tap to view and book this room
                    </div>
                  </button>
                ))}
              </section>

              {message && <div className="rounded-2xl bg-amber-400/20 px-5 py-4 text-amber-100">{message}</div>}
            </div>
          </div>
        );
      }

      if (displayView === "day") {
        return (
          <div className="min-h-screen bg-slate-950 p-6 text-white">
            <div className="mx-auto max-w-7xl space-y-6">
              <Header
                title="Day Schedule"
                subtitle={`${schedule?.date || state?.now_date || ""} · ${selectedDisplayRoom || "All Rooms"}`}
              />

              <div className="flex flex-wrap gap-3">
                <input
                  type="date"
                  value={scheduleDate || state?.now_date || ""}
                  onChange={async (e) => {
                    setScheduleDate(e.target.value);
                    await loadSchedule("DAY", e.target.value);

                  className="rounded-2xl bg-white px-4 py-3 text-slate-950"

                <button onClick={async () => loadSchedule("DAY")} className="rounded-2xl bg-white/10 px-5 py-3 text-sm font-semibold text-white">
                  Reload Day

              <section className="grid grid-cols-1 gap-6 lg:grid-cols-3">
                {(schedule?.day_rows || []).map((room) => (
                  <div key={room.room_name} className="rounded-[2rem] bg-white/10 p-6 shadow-2xl">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <div className="text-sm uppercase tracking-[0.2em] text-white/50">Meeting Room</div>
                        <h2 className="mt-2 text-2xl font-black">{room.room_name}</h2>

              {message && <div className="rounded-2xl bg-amber-400/20 px-5 py-4 text-amber-100">{message}</div>}
            </div>
          </div>
        );
      }

      if (displayView === "month") {
        return (
          <div className="min-h-screen bg-slate-950 p-6 text-white">
            <div className="mx-auto max-w-7xl space-y-6">
              <Header
                title="Monthly Schedule"
                subtitle={`${schedule?.start_date || ""} - ${schedule?.end_date || ""} · ${selectedDisplayRoom || "All Rooms"}`}
              />

              <div className="flex flex-wrap gap-3">
                <input
                  type="date"
                  value={scheduleDate || state?.now_date || ""}
                  onChange={async (e) => {
                    setScheduleDate(e.target.value);
                    await loadSchedule("MONTH", e.target.value);
                  }}
                  className="rounded-2xl bg-white px-4 py-3 text-slate-950"
                />
                <button onClick={async () => loadSchedule("MONTH")} className="rounded-2xl bg-white/10 px-5 py-3 text-sm font-semibold text-white">
                  Reload Month
                </button>
              </div>

              <section className="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4">
                {(schedule?.month_rows || []).map((day) => {
                  const busy = Number(day.booking_count || 0) > 0;
                  return (
                    <button
                      key={day.date}
                      type="button"
                      onClick={async () => {
                        setScheduleDate(day.date);
                        setDisplayView("day");
                        await loadSchedule("DAY", day.date);

                      className={`text-left rounded-3xl p-5 shadow-xl transition hover:scale-[1.01] active:scale-[0.99] ${busy ? "bg-sky-900/70" : "bg-white/10"}`}
                    >
                      <div className="flex items-center justify-between">

                      </div>

                      <div className="mt-2 text-sm text-white/60">Reserved: {formatDisplayMinutes(day.reserved_minutes)}</div>

                      <div className="mt-4 space-y-3">

                          <div key={room.room_name} className="rounded-2xl bg-black/20 p-3">

                              <span className="font-bold">{shortRoomName(room.room_name)}</span>

                            </div>

            <Header
              title={activeRoomName || "Loading room..."}
              subtitle={`${state?.device_name || "Smart Display"} · ${state?.now_date || ""} · ${state?.now_time || ""}`}
            />

            <section className="grid flex-1 grid-cols-1 gap-6 lg:grid-cols-3">
              <div className="lg:col-span-2 rounded-[2rem] bg-white/10 p-8 shadow-2xl">

                <div className="mt-4 text-7xl font-black">{inUse ? "IN USE" : "AVAILABLE"}</div>

                {activeRoomState?.current_booking ? (
                  <div className="mt-8 rounded-3xl bg-black/20 p-6">
                    <div className="text-2xl font-bold">
                      {activeRoomState.current_booking.start_time} - {activeRoomState.current_booking.end_time}
                    </div>
                    <div className="mt-2 text-xl">{activeRoomState.current_booking.purpose || "Booked"}</div>
                    <div className="mt-1 text-white/60">By {activeRoomState.current_booking.requester_name || "Booked"}</div>
                  </div>
                ) : (
                  <div className="mt-8 rounded-3xl bg-black/20 p-6 text-2xl">This room is currently free.</div>
                )}

                {activeRoomState?.next_booking ? (
                  <div className="mt-6 rounded-3xl bg-white/10 p-6">
                    <div className="text-sm uppercase tracking-[0.2em] text-white/50">Next Booking</div>
                    <div className="mt-2 text-2xl font-bold">
                      {activeRoomState.next_booking.start_time} - {activeRoomState.next_booking.end_time}
                    </div>
                    <div className="text-white/70">{activeRoomState.next_booking.purpose || "Booked"}</div>
                  </div>

                  <div className="mt-6 rounded-3xl bg-white/10 p-6 text-white/70">No upcoming booking today.</div>

              <aside className="rounded-[2rem] bg-white p-6 text-slate-900 shadow-2xl">

                  <span className="text-sm font-medium text-slate-600">Your email</span>

          </div>

    function getLocationParam(loc, key) {
      if (loc?.parameter && loc.parameter[key]) return loc.parameter[key];
      if (loc?.parameters && loc.parameters[key] && loc.parameters[key][0]) return loc.parameters[key][0];

      const params = new URLSearchParams(window.location.search);
      return params.get(key) || "";
    }

    function AppRoot() {
      const [route, setRoute] = React.useState({ loading: true, mode: "" });

      React.useEffect(() => {
        if (typeof google !== "undefined" && google.script?.url?.getLocation) {
          google.script.url.getLocation((loc) => {
            const mode = getLocationParam(loc, "mode");
            const token = getLocationParam(loc, "token");

            if (token) localStorage.setItem("room_display_device_token", token);

            setRoute({ loading: false, mode });
          });
        } else {
          const params = new URLSearchParams(window.location.search);
          const mode = params.get("mode") || "";
          const token = params.get("token") || "";

          if (token) localStorage.setItem("room_display_device_token", token);

          setRoute({ loading: false, mode });
        }
      }, []);

      if (route.loading) {
        return (
          <div className="min-h-screen grid place-items-center bg-slate-950 text-white">
            <div className="text-center">
              <div className="text-2xl font-black">Loading ISE Room Display...</div>
              <div className="mt-2 text-white/60">Please wait</div>
            </div>
          </div>
        );
      }

      if (route.mode === "display") return <RoomDisplayApp />;

      if (typeof RoomBookingDashboard === "function") return <RoomBookingDashboard />;
      return <RoomDisplayApp />;
    }

    root.render(<AppRoot />);
